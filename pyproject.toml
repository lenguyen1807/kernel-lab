[project]
name = "cuda-lab"
version = "0.1.0"
description = "A small CUDA kernel experiment harness."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "ninja",
    "numpy",
    "nsight-python; sys_platform == 'linux'",
    "torch",
    "triton; sys_platform == 'linux'",
]

[project.scripts]
cuda-lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]
